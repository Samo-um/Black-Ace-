<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>♠️ BLACK ACE CASINO — Бильярд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.top{background:linear-gradient(180deg,#1a1a1a,#0a0a0a);padding:12px;text-align:center;border-bottom:2px solid #d4af37;position:sticky;top:0;z-index:10}
.top h1{font-size:18px;color:#d4af37;letter-spacing:1px}
.top p{font-size:11px;color:#888;margin-top:2px}
.balance-bar{display:flex;justify-content:space-between;padding:10px 14px;background:#111;border-bottom:1px solid #222}
.balance-bar b{color:#d4af37;font-size:18px}
.bet-row{display:flex;gap:8px;padding:12px;overflow-x:auto}
.bet-btn{flex:1;min-width:70px;padding:10px 6px;background:#1a1a1a;border:2px solid #333;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;text-align:center;font-size:14px}
.bet-btn.active{background:#d4af37;color:#000;border-color:#d4af37}
.table-wrap{margin:10px 14px;background:#0d5c2e;border:4px solid #5a3a1a;border-radius:16px;padding:14px;position:relative;min-height:340px;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.table-wrap:before{content:"♠️ BLACK ACE • SINCE 1976 • MACAU";position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px}
.pocket{position:absolute;width:28px;height:28px;background:#000;border-radius:50%;border:2px solid #333}
.p1{top:6px;left:6px}.p2{top:6px;right:6px}.p3{bottom:6px;left:6px}.p4{bottom:6px;right:6px}.p5{top:6px;left:50%;transform:translateX(-50%)}.p6{bottom:6px;left:50%;transform:translateX(-50%)}
.balls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px;min-height:120px}
.ball{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);transition:.15s}
.ball:active{transform:scale(.9)}
.ball.selected{outline:3px solid #d4af37;transform:scale(1.15)}
.ball.gone{opacity:.15;pointer-events:none;transform:scale(.7)}
.c1{background:#ffcc00;color:#000}.c2{background:#2196f3}.c3{background:#f44336}.c4{background:#9c27b0}.c5{background:#ff9800;color:#000}.c6{background:#4caf50}.c7{background:#795548}.c8{background:#111;border-color:#fff}.c9{background:#ffcc00;color:#000}.c10{background:#2196f3}.c11{background:#f44336}.c12{background:#9c27b0}.c13{background:#ff9800;color:#000}.c14{background:#4caf50}.c15{background:#795548}
.info{text-align:center;padding:8px;font-size:13px;color:#ccc;line-height:1.5}
.info b{color:#fff}
.controls{padding:12px 14px}
.power-label{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:6px}
input[type=range]{width:100%;accent-color:#d4af37;height:30px}
.shoot-btn{width:100%;padding:16px;background:linear-gradient(180deg,#f5d76e,#d4af37);border:none;border-radius:14px;font-size:18px;font-weight:900;color:#000;cursor:pointer;margin-top:10px}
.shoot-btn:disabled{opacity:.4}
.bot-btn{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:12px;color:#fff;margin-top:8px;cursor:pointer}
.log{margin:12px 14px;background:#111;border-radius:12px;padding:10px;font-size:12px;line-height:1.6;max-height:120px;overflow-y:auto;color:#aaa}
.log b{color:#fff}
.menu{display:flex;gap:8px;padding:0 14px 14px}
.menu button{flex:1;padding:12px;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:12px;cursor:pointer}
.result{margin:12px 14px;padding:16px;border-radius:14px;text-align:center;display:none}
.result.win{background:#1a3a1a;border:2px solid #4caf50}
.result.lose{background:#3a1a1a;border:2px solid #f44336}
.result h2{font-size:22px;margin-bottom:6px}
</style>
</head>
<body>

<div class="top">
<h1>♠️ BLACK ACE CASINO</h1>
<p>SINCE 1976 • MACAU • БИЛЬЯРД</p>
</div>

<div class="balance-bar">
<div>💰 Баланс: <b id="balance">1000 🪙</b></div>
<div>🎱 Забито: <b id="score">0 / 15</b></div>
</div>

<div class="bet-row" id="bets">
<div class="bet-btn" data-bet="50">50 🪙</div>
<div class="bet-btn active" data-bet="100">100 🪙</div>
<div class="bet-btn" data-bet="250">250 🪙</div>
<div class="bet-btn" data-bet="500">500 🪙</div>
<div class="bet-btn" data-bet="1000">1000 🪙</div>
</div>

<div class="table-wrap">
<div class="pocket p1"></div><div class="pocket p2"></div><div class="pocket p3"></div><div class="pocket p4"></div><div class="pocket p5"></div><div class="pocket p6"></div>
<div class="balls" id="balls"></div>
</div>

<div class="info" id="info">👇 <b>Выбери ставку, нажми на шар и жми УДАРИТЬ</b><br>✅ Выиграл → <b>+ставка x2 ПРИШЛО</b> &nbsp; ❌ Проиграл → <b>-ставка УШЛО</b></div>

<div class="controls">
<div class="power-label"><span>🎯 Сила удара</span><span id="powerVal">55%</span></div>
<input type="range" id="power" min="10" max="100" value="55">
<button class="shoot-btn" id="shootBtn" onclick="shoot()">🎱 УДАРИТЬ!</button>
<button class="bot-btn" onclick="botTurn()">🤖 Ход бота</button>
</div>

<div class="result" id="result"></div>

<div class="log" id="log"><b>📜 Лог игры:</b><br>Игра началась. Твой ход!</div>

<div class="menu">
<button onclick="newGame()">🔄 Новая игра</button>
<button onclick="closeApp()">❌ Закрыть</button>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.setHeaderColor('#0a0a0a');
tg.setBackgroundColor('#0a0a0a');

let balance = 1000;
let bet = 100;
let balls = [];
let selected = null;
let gameOver = false;
let playerBalls = 0;
let botBalls = 0;

function initBalls(){
  balls = [];
  for(let i=1;i<=15;i++) balls.push({n:i, gone:false});
  playerBalls = 0; botBalls = 0; gameOver = false; selected = null;
  document.getElementById('result').style.display='none';
  render();
  log('Новая игра. Ставка '+bet+' 🪙. Твой ход!');
}

function render(){
  let el = document.getElementById('balls');
  el.innerHTML = '';
  balls.forEach(b=>{
    let d = document.createElement('div');
    d.className = 'ball c'+b.n + (b.gone?' gone':'') + (selected===b.n?' selected':'');
    d.textContent = b.n;
    d.onclick = ()=>{ if(b.gone||gameOver) return; selected=b.n; render(); };
    el.appendChild(d);
  });
  document.getElementById('balance').textContent = balance + ' 🪙';
  document.getElementById('score').textContent = (playerBalls+botBalls)+' / 15';
}

function log(t){
  let l = document.getElementById('log');
  l.innerHTML += '<br>• '+t;
  l.scrollTop = l.scrollHeight;
}

document.getElementById('power').addEventListener('input', e=>{
  document.getElementById('powerVal').textContent = e.target.value + '%';
});

document.querySelectorAll('.bet-btn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.bet-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    bet = parseInt(b.dataset.bet);
    log('Ставка изменена: '+bet+' 🪙');
  };
});

function shoot(){
  if(gameOver){ alert('Игра окончена! Нажми Новая игра'); return; }
  if(selected===null){ alert('Сначала нажми на шар!'); return; }
  let power = parseInt(document.getElementById('power').value);
  let chance = (power>=40 && power<=70) ? 0.75 : (power>=20 && power<=85) ? 0.5 : 0.25;
  let ball = balls.find(b=>b.n===selected);
  if(Math.random() < chance){
    ball.gone = true;
    playerBalls++;
    log('✅ Ты забил шар '+selected+'! Сила '+power+'%');
    document.getElementById('info').innerHTML = '✅ <b>Забил '+selected+'!</b> Выбери следующий шар';
    if(selected===8){ winGame(); return; }
    selected = null;
    render();
    if(playerBalls+botBalls>=15){ checkEnd(); }
  } else {
    log('❌ Промах по шару '+selected+' (сила '+power+'%)');
    document.getElementById('info').innerHTML = '❌ <b>Промах!</b> Ход бота...';
    setTimeout(botTurn, 800);
  }
  render();
}

function botTurn(){
  if(gameOver) return;
  let alive = balls.filter(b=>!b.gone);
  if(alive.length===0){ checkEnd(); return; }
  let pick = alive[Math.floor(Math.random()*alive.length)];
  let chance = 0.55;
  if(Math.random() < chance){
    pick.gone = true;
    botBalls++;
    log('🤖 Бот забил шар '+pick.n);
    if(pick.n===8){ loseGame('Бот забил 8!'); return; }
  } else {
    log('🤖 Бот промахнулся');
  }
  document.getElementById('info').innerHTML = '🎯 <b>Твой ход!</b> Выбери шар и бей';
  render();
  if(playerBalls+botBalls>=15) checkEnd();
}

function checkEnd(){
  if(playerBalls > botBalls) winGame();
  else loseGame('У бота больше шаров');
}

function winGame(){
  gameOver = true;
  let winAmount = bet * 2;
  let before = balance;
  balance += winAmount;
  document.getElementById('info').innerHTML = '🎉 <b>ТЫ ВЫИГРАЛ!</b>';
  let r = document.getElementById('result');
  r.className = 'result win';
  r.style.display = 'block';
  r.innerHTML = '<h2>🎉 ПОБЕДА!</h2><p>Ставка: '+bet+' 🪙</p><p><b>+'+winAmount+' 🪙 ПРИШЛО!</b></p><p>Баланс: '+before+' → '+balance+' 🪙</p>';
  log('🎉 ПОБЕДА! +'+winAmount+' 🪙 ПРИШЛО');
  sendToBot(true, winAmount);
  render();
  try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
}

function loseGame(reason){
  gameOver = true;
  let before = balance;
  // ставка уже вычтена в начале игры в боте, тут просто фиксируем проигрыш
  document.getElementById('info').innerHTML = '😢 <b>ТЫ ПРОИГРАЛ</b>';
  let r = document.getElementById('result');
  r.className = 'result lose';
  r.style.display = 'block';
  r.innerHTML = '<h2>😢 ПОРАЖЕНИЕ</h2><p>'+reason+'</p><p>Ставка: '+bet+' 🪙</p><p><b>-'+bet+' 🪙 УШЛО</b></p><p>Баланс: '+balance+' 🪙</p>';
  log('😢 ПОРАЖЕНИЕ: '+reason+' -'+bet+' 🪙 УШЛО');
  sendToBot(false, 0);
  render();
  try{ tg.HapticFeedback.notificationOccurred('error'); }catch(e){}
}

function sendToBot(win, winAmount){
  let data = { type: "game_end", win: win, bet: bet, winAmount: winAmount, balance: balance };
  try{ tg.sendData(JSON.stringify(data)); }catch(e){ console.log(e); }
}

function newGame(){
  if(balance < bet){ alert('Не хватает монет! Баланс: '+balance); return; }
  balance -= 0; // ставку снимает бот, тут не снимаем дважды
  initBalls();
  document.getElementById('info').innerHTML = '👇 <b>Выбери шар и жми УДАРИТЬ</b><br>✅ Выиграл → +x2 ПРИШЛО &nbsp; ❌ Проиграл → -ставка УШЛО';
}

function closeApp(){ try{ tg.close(); }catch(e){} }

initBalls();
</script>
</body>
</html>
